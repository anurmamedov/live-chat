{% extends "base.html" %}

{% block content %}
  <h2>Sign Up</h2>
  <form method="post" action="{% url 'authapp:register' %}" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <!-- Add a file input for the avatar -->
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p>Already have an account? <a href="{% url 'authapp:login' %}">Login here</a>.</p>
{% endblock %}
