{% extends "base.html" %}

{% block content %}
  <h2>Sign Up</h2>
  <form method="post" action="{% url 'authapp:register' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p>Already have an account? <a href="{% url 'authapp:login' %}">Login here</a>.</p>
{% endblock %}
