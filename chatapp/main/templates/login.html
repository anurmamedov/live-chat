{% extends "base.html" %}

{% block content %}
  <form method="post" action="{% url 'authapp:login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
  <p>New to our site? <a href="{% url 'authapp:register' %}">Sign up now!</a></p>
  <!-- <p><a href="{% url 'authapp:password_reset' %}">Forgot password?</a></p> -->
{% endblock %}
